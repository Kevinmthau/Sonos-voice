[build]
  command = "npm run build"
  publish = "dist"
  functions = "netlify/functions"

[[headers]]
  for = "/*"
  [headers.values]
    Content-Security-Policy = "default-src 'self'; base-uri 'self'; connect-src 'self'; font-src 'self' https://fonts.gstatic.com; form-action 'self'; frame-ancestors 'none'; img-src 'self' data:; object-src 'none'; script-src 'self'; style-src 'self' https://fonts.googleapis.com"
    Referrer-Policy = "strict-origin-when-cross-origin"
    X-Content-Type-Options = "nosniff"

# Web OAuth flow
[[redirects]]
  from = "/sonos/oauth/start/web"
  to = "/.netlify/functions/sonos-auth-start-web"
  status = 200

[[redirects]]
  from = "/sonos/oauth/callback/web"
  to = "/.netlify/functions/sonos-auth-callback"
  status = 200

# iOS OAuth flow (preserved)
[[redirects]]
  from = "/sonos/oauth/start"
  to = "/.netlify/functions/sonos-auth-start"
  status = 200

[[redirects]]
  from = "/sonos/oauth/callback"
  to = "/.netlify/functions/sonos-auth-callback"
  status = 200

# Sonos events webhook
[[redirects]]
  from = "/sonos/events"
  to = "/.netlify/functions/sonos-events"
  status = 200

# Sonos token refresh (must be matched before /api/sonos)
[[redirects]]
  from = "/api/sonos/refresh"
  to = "/.netlify/functions/sonos-refresh"
  status = 200

# Sonos API proxy
[[redirects]]
  from = "/api/sonos"
  to = "/.netlify/functions/sonos-proxy"
  status = 200

# OpenAI speech-to-text proxy
[[redirects]]
  from = "/api/transcribe"
  to = "/.netlify/functions/openai-transcribe"
  status = 200

# Legacy app path compatibility
[[redirects]]
  from = "/sonos"
  to = "/"
  status = 301

[[redirects]]
  from = "/sonos/*"
  to = "/:splat"
  status = 301

# SPA fallback for the Sonos app at the site root
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
